[l2b_corra2022t_trmm_prtmi_v07a]
type = properties
level = 2B
platform = TRMM
sensor = PRTMI
algorithm = CORRA2022T
version = 07A
variant =
alias = l2b_trmm_cmb
granule_dimensions=["matched_scans", "matched_pixels"]
granule_partitions=[18]

[matched_scans]
type = dimension

[matched_pixels]
type = dimension

[vertical_bins]
type = dimension

[latitude]
type = latitude_coordinate
name = KuTMI/Latitude
unit = degree
dimensions = ["matched_scans", "matched_pixels"]
description = "The earth latitude of the center of the IFOV at the altitude of the earth ellipsiod. Latitude is positive north, negative south. Missing value as -9999.9"

[longitude]
type = longitude_coordinate
name = KuTMI/Longitude
unit = degree
dimensions = ["matched_scans", "matched_pixels"]
description = "The earth longitude of the center of the IFOV at the altitude of the earth ellipsiod. Longitude is positive east, negative west. A point on the 180th meridian has the value -180 degrees. Missing value as -9999.9"

[estim_surf_precip_tot_rate]
type = variable
name = KuTMI/estimSurfPrecipTotRate
unit = mm/h
dimensions = ["matched_scans", "matched_pixels"]
description = "Estimated surface total precip rate (from lowest clutter-free bin). Missing values as -9999.9"

[estim_surf_precip_tot_rate_sigma]
type = variable
name = KuTMI/estimSurfPrecipTotRateSigma
unit = mm/h
dimensions = ["matched_scans", "matched_pixels"]
description = "Estimated surface total precip rate uncertainty (from lowest clutter-free bin). Missing values as -9999.9"

[scan_time]
type = time_coordinate
name = KuTMI/ScanTime
callback = _extract_scantime
dimensions = ["matched_scans"]

[lowest_uncluttered_bin]
type = variable
name = KuTMI/lowestUnclutteredBin
dimensions = ["matched_scans", "matched_pixels"]
description = "Lowest clutter free bin. Missing values as -9999"

[lowest_estimate_bin]
type = variable
name = KuTMI/lowestEstimateBin
dimensions = ["matched_scans", "matched_pixels"]
description = "Lowest bin for estimated precipitation. Missing values as -9999"

[multi_scat_max_contrib]
type = variable
name = KuTMI/multiScatMaxContrib
dimensions = ["matched_scans", "matched_pixels"]
unit = dB
description = "Maximum contribution, in a given radar profile, by multiple scattering to the simulated reflectivity. Missing values as -9999.9"

[near_surf_precip_tot_rate]
type = variable
name = KuTMI/nearSurfPrecipTotRate
dimensions = ["matched_scans", "matched_pixels"]
unit = mm/h
description = "Near-surface total precip rate (from lowest clutter-free bin). Values range from 0 to 300 mm/h. Missing values as -9999.9"

[near_surf_precip_tot_rate_sigma]
type = variable
name = KuTMI/nearSurfPrecipTotRateSigma
dimensions = ["matched_scans", "matched_pixels"]
unit = mm/h
description = "Near-surface total precip rate uncertainty (from lowest clutter-free bin). Values range from 0 to 300 mm/h. Missing values as -9999.9"

[near_surf_precip_liq_rate]
type = variable
name = KuTMI/nearSurfPrecipLiqRate
dimensions = ["matched_scans", "matched_pixels"]
unit = mm/h
description = "Near-surface liquid precip rate (from lowest clutter-free bin). Values range from 0 to 300 mm/h. Missing values as -9999.9"

[estim_surf_precip_liq_rate]
type = variable
name = KuTMI/estimSurfPrecipLiqRate
dimensions = ["matched_scans", "matched_pixels"]
unit = mm/h
description = "Estimated surface liquid precip rate (from lowest clutter-free bin). Values range from 0 to 300 mm/h. Missing values as -9999.9"

[precip_tot_water_cont]
type = variable
name = KuTMI/precipTotWaterCont
dimensions = ["matched_scans", "matched_pixels", "vertical_bins"]
unit = mm/h
description = "Total precipitation water content. Values range from 0 to 18 g/m 3. Missing values as -9999.9"

[precip_liq_water_cont]
type = variable
name = KuTMI/precipLiqWaterCont
dimensions = ["matched_scans", "matched_pixels", "vertical_bins" ]
unit = mm/h
description = "Total precipitation liquid water content. Values range from 0 to 18 g/m 3. Missing values as -9999.9"

[precip_tot_rate]
type = variable
name = KuTMI/precipTotRate
dimensions = ["matched_scans", "matched_pixels", "vertical_bins"]
unit = mm/h
description = "Total precipitation rate. Values range from 0 to 300 mm/hr. Missing values as -9999.9"

[precip_liq_rate]
type = variable
name = KuTMI/precipLiqRate
dimensions = ["matched_scans", "matched_pixels", "vertical_bins"]
unit = mm/h
description = "Liquid precipitation rate. Values range from 0 to 300 mm/hr. Missing values as -9999.9"

[cloud_ice_water_cont]
type = variable
name = KuTMI/cloudIceWaterCont
dimensions = ["matched_scans", "matched_pixels", "vertical_bins"]
unit = mm/h
description = "Cloud ice water content. Values range from 0 to 18 g/m 3. Missing values as -9999.9"

[cloud_liq_water_cont]
type = variable
name = KuTMI/cloudLiqWaterCont
dimensions = ["matched_scans", "matched_pixels", "vertical_bins"]
unit = mm/h
description = "Cloud liquid water content. Values range from 0 to 18 g/m 3. Missing values as -9999.9"

[precipitation_type]
type = variable
name = KuTMI/Input/precipitationType
dimensions = ["matched_scans", "matches_pixels"]
unit =
description = "Precipitation type classification from 2AKu. Special values are defined as: -9999 Missing value"

[spacecraft_latitude]
type = variable
name = KuTMI/navigation/scLat
dimensions = ["matched_scans"]

[spacecraft_longitude]
type = variable
name = KuTMI/navigation/scLon
dimensions = ["matched_scans"]

[spacecraft_altitude]
type = variable
name = KuTMI/navigation/scAlt
dimensions = ["matched_scans"]
