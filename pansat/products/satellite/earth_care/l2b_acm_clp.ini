[l2b_acm_clp]
type = properties
name = ACM_CLP
level = 2B
alias = l2b_acm_clp

granule_dimensions=["rays"]
granule_partitions = [1]

[rays]
type = dimension

[range_bins]
type = dimension

[time]
type = time_coordinate
name = ScienceData/time
description = UTC time at JSG pixel
unit = s since 2000-01-01 00:00:00
dimensions = ["rays"]
callback = _calculate_profile_time

[latitude]
type = latitude_coordinate
name = ScienceData/latitude
description = Spacecraft geodetic latitude.
unit = degree
dimensions = ["rays"]

[longitude]
type = longitude_coordinate
name = ScienceData/longitude
description = Spacecraft geodetic longitude.
unit = degree
dimensions = ["rays"]

[height]
type = variable
name = ScienceData/height
description = Height of radar bin.
unit = mm/h
dimensions = ["rays", "range_bins"]

[cloud_water_content]
type = variable
name = ScienceData/cloud_water_content
description = Cloud Water Content.
unit = g/m^{-3}
dimensions = ["rays", "range_bins"]

[cloud_ice_content]
type = variable
name = ScienceData/cloud_ice_content
description = Cloud Ice Content.
unit = g/m^{-3}
dimensions = ["rays", "range_bins"]
