[l2b_acm_cap]
type = properties
name = ACM_CAP
level = 2B
alias = l2b_acm_cap

granule_dimensions=["rays"]
granule_partitions = [18]

[rays]
type = dimension

[range_bins]
type = dimension

[time]
type = time_coordinate
name = ScienceData/time
description = UTC time at JSG pixel
unit = s since 2000-01-01 00:00:00
dimensions = ["rays"]
callback = _calculate_profile_time

[latitude]
type = latitude_coordinate
name = ScienceData/latitude
description = Spacecraft geodetic latitude.
unit = degree
dimensions = ["rays"]

[longitude]
type = longitude_coordinate
name = ScienceData/longitude
description = Spacecraft geodetic longitude.
unit = degree
dimensions = ["rays"]

[height]
type = variable
name = ScienceData/height
description = Height of radar bin.
unit = mm/h
dimensions = ["rays", "range_bins"]

[rain_rate]
type = variable
name = ScienceData/rain_rate
description = Rain rate.
unit = mm/s
dimensions = ["rays", "range_bins"]
callback = _mask_invalid

[snowfall_rate]
type = variable
name = ScienceData/ice_mass_flux
description = Rain rate.
unit = mm/s
dimensions = ["rays", "range_bins"]
callback = _mask_invalid
