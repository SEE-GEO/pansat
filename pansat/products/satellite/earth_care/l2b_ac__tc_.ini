[l2b_ac_tc]
type = properties
name = AC__TC_
level = 2B
alias = l2b_ac_tc

granule_dimensions=["rays"]
granule_partitions = [1]

[rays]
type = dimension

[range_bins]
type = dimension

[time]
type = time_coordinate
name = ScienceData/time
description = UTC time at JSG pixel
unit = s since 2000-01-01 00:00:00
dimensions = ["rays"]
callback = _calculate_profile_time

[latitude]
type = latitude_coordinate
name = ScienceData/latitude
description = Spacecraft geodetic latitude.
unit = degree
dimensions = ["rays"]

[longitude]
type = longitude_coordinate
name = ScienceData/longitude
description = Spacecraft geodetic longitude.
unit = degree
dimensions = ["rays"]

[height]
type = variable
name = ScienceData/height
description = Height of radar bin.
unit = mm/h
dimensions = ["rays", "range_bins"]

[synergetic_detection]
type = variable
name = ScienceData/synergetic_target_classification
description = CPR detection.
unit = " -3 = no data, -2 = surface, -1 = attenuated, 0 = clear, 1 = liquid cloud (warm), 2 = liquid cloud (supercooled), 3 = ice cloud, 10 = dust, 11 = sea salt, 12 = continental pollution, 13 = smoke, 14 = dusty smoke, 15 = dusty mix, 20 = STS (PSC I), 21 = NAT (PSC II), 22 = stratospheric ice, 25 = stratospheric ash, 26 = stratospheric sulphate, 27 = stratospheric smoke, 101 = unknown aerosol; low probability (no class assigned), 102 = unknown aerosol; outside of parameter space, 104 = unknown stratospheric aerosol; low probability (no class assigned), 105 = unknown stratospheric aerosol target; outside of parameter space, 106 = unknown PSC; low probability (no class assigned), 107 = unknown PSC; outside of parameter space"
dimensions = ["rays", "range_bins"]

[cpr_detection]
type = variable
name = ScienceData/CPR_detection_status
description = CPR detection.
unit = " -1 = no data, 0 = surface and sub-surface, 1 = clear, 2 = totally extinguished, 3 = likely extinguished, 4 = target detected, no reliable measurements, 5 = target detected, only, reflectivity reliable, 6 = target detected, reflectivity enhanced by multiple scattering, 7 = target detected, only Doppler reliable, 8 = target detected, both reflectivity and Doppler reliable, 9 = clutter separated from the cloud/precipitation return or clear, 10 = clutter not separated from the lowest hydrometeor layer detected, 11 = uncertain, 12 = second-trip echo "
dimensions = ["rays", "range_bins"]

